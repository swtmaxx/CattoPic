name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: worker

      # 生产配置直接使用仓库内的 wrangler.prod.toml，不再依赖 WRANGLER_TOML Secret。
      # 若未来需调整资源 ID / 公开域名，直接修改该文件并推送即可。
      - name: Verify production config
        working-directory: worker
        run: |
          test -f wrangler.prod.toml || { echo "::error::wrangler.prod.toml missing"; exit 1; }
          grep -q "^main[[:space:]]*=" wrangler.prod.toml || { echo "::error::wrangler.prod.toml is missing 'main'"; exit 1; }
          grep -q "^name[[:space:]]*=" wrangler.prod.toml || { echo "::error::wrangler.prod.toml is missing 'name'"; exit 1; }
          echo "✅ Production config OK"

      - name: Typecheck Worker
        working-directory: worker
        run: pnpm exec tsc --noEmit

      - name: Deploy to Cloudflare
        working-directory: worker
        run: |
          pnpm wrangler deploy --config wrangler.prod.toml
          echo "✅ Deploy completed"
